name: Tu Dong Dich Van Ban

on:
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công bất cứ lúc nào

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn về máy chủ
        uses: actions/checkout@v3

      - name: Cài đặt môi trường Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt các thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers accelerate

      - name: Chạy script dịch
        run: |
          python run_translation.py

      - name: Lưu kết quả dịch lên GitHub
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add output.txt
          git commit -m "Đã dịch xong văn bản" || exit 0
          git push
